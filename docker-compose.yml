version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: preparec_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: PrepareC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - preparec_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  preparec_postgres_data:
